name: Build MIPS (QCA9531)

on:
  workflow_dispatch:

jobs:
  # Linux MIPS big-endian, soft-float (QCA9531 @ 650MHz, e.g. GL.iNet Mudi V2 / OpenWrt ath79)
  # Cross-compiled with Bootlin mips32 musl toolchain, fully static binary
  build-linux-mips-muslsf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install mips32 musl toolchain and build dependencies
        run: |
          # Bootlin prebuilt mips32 big-endian musl toolchain (soft-float, generic mips32)
          # Compatible with MIPS 24Kc (QCA9531) — extra march/float flags applied per-build
          TC_URL="https://toolchains.bootlin.com/downloads/releases/toolchains/mips32/tarballs/mips32--musl--stable-2024.05-1.tar.xz"
          curl -sL "$TC_URL" | tar xJ
          TC_DIR="$(pwd)/mips32--musl--stable-2024.05-1"
          "$TC_DIR/relocate-sdk.sh"
          echo "$TC_DIR/bin" >> $GITHUB_PATH
          export PATH="$TC_DIR/bin:$PATH"

          # Verify cross-compiler
          mips-linux-gcc --version
          mips-linux-gcc -dumpmachine

          PREFIX="$(pwd)/mips-deps"
          mkdir -p "$PREFIX"

          # Target-specific flags for QCA9531 (MIPS 24Kc, no FPU, big-endian)
          export CC=mips-linux-gcc
          export AR=mips-linux-ar
          export RANLIB=mips-linux-ranlib
          export STRIP=mips-linux-strip
          export CFLAGS="-O2 -march=24kc -msoft-float -EB"
          export LDFLAGS="-EB"
          HOST_TRIPLE="mips-linux-musl"

          # Build zlib
          curl -sL https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz | tar xz
          cd zlib-1.3.1
          CHOST=mips-linux ./configure --static --prefix="$PREFIX"
          make -j$(nproc) && make install
          cd ..

          # Build liblzma
          curl -sL https://github.com/tukaani-project/xz/releases/download/v5.6.3/xz-5.6.3.tar.gz | tar xz
          cd xz-5.6.3
          ./configure --host="$HOST_TRIPLE" --enable-static --disable-shared \
            --disable-xz --disable-xzdec --disable-lzmadec --disable-lzmainfo \
            --disable-scripts --disable-doc --prefix="$PREFIX"
          make -j$(nproc) && make install
          cd ..

          # Build libxml2
          curl -sL https://download.gnome.org/sources/libxml2/2.12/libxml2-2.12.9.tar.xz | tar xJ
          cd libxml2-2.12.9
          ./configure --host="$HOST_TRIPLE" --enable-static --disable-shared --without-python \
            --prefix="$PREFIX" --with-zlib="$PREFIX" --with-lzma="$PREFIX" \
            CFLAGS="$CFLAGS -I$PREFIX/include" LDFLAGS="$LDFLAGS -L$PREFIX/lib"
          make -j$(nproc) && make install
          cd ..

          # Build libusb (static binary doesn't need runtime udev)
          curl -sL https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2 | tar xj
          cd libusb-1.0.27
          ./configure --host="$HOST_TRIPLE" --enable-static --disable-shared \
            --disable-udev --prefix="$PREFIX"
          make -j$(nproc) && make install
          cd ..

          echo "=== Static libraries ==="
          ls -la "$PREFIX/lib/"*.a

      - name: Build static MIPS binary
        run: |
          PREFIX="$(pwd)/mips-deps"

          CFLAGS="-O2 -Wall -g -march=24kc -msoft-float -EB -DBUILD_STATIC -I$PREFIX/include/libxml2 -I$PREFIX/include/libusb-1.0 -I$PREFIX/include"
          LDFLAGS="-EB -static $PREFIX/lib/libxml2.a $PREFIX/lib/libusb-1.0.a $PREFIX/lib/liblzma.a $PREFIX/lib/libz.a -lpthread -lm"

          # pkg-config wrapper returning empty (we pass flags directly)
          cat > /tmp/pkg-config-nolibs <<'SCRIPT'
          #!/bin/bash
          exit 0
          SCRIPT
          chmod +x /tmp/pkg-config-nolibs

          echo "CFLAGS: $CFLAGS"
          echo "LDFLAGS: $LDFLAGS"

          make CC=mips-linux-gcc \
               PKG_CONFIG=/tmp/pkg-config-nolibs \
               CFLAGS="$CFLAGS" \
               LDFLAGS="$LDFLAGS"

          echo "=== Verify MIPS static build ==="
          file qfenix
          mips-linux-strip qfenix
          ls -la qfenix
          echo "=== ELF header ==="
          mips-linux-readelf -h qfenix | head -20

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-mips-muslsf
          path: qfenix
